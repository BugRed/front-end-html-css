<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluguinho</title>
    <link rel="stylesheet" href="./style/reset.min.css">
    <link rel="stylesheet" href="./style/animation.css">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/mainLogin.css">
</head>
<body>

    <!-- Header Section -->
    <header>
      <nav class="navbar">
        <!-- Logo -->
        <div class="div-logo">
          <a class="navbar-brand" href="#">
            <a href="./index.html"><img class="logo" src="./assets/logo.png" alt="Logo" /></a>
          </a>
        </div>
        <!-- Navbar Links -->
        <ul class="principal">
          <li class="emLinha lnk"><a href="index.html">Home</a></li>
          <li class="emLinha lnk">
            <a href="carlist.html">Carros mais populares <span>▼</span></a>
            <ul class="oculto">
              <li><a class="lnk" href="carlist.html">Renault Kwid</a></li>
              <li><a class="lnk" href="carlist2.html">Uno Com escada</a></li>
              <li><a class="lnk" href="carlist3.html">Riquixá</a></li>
            </ul>
          </li>
          <li class="emLinha lnk"><a href="about.html">Sobre</a></li>
          <li class="emLinha lnk"><a href="contact.html">Contato</a></li>
        </ul>
        <!-- Search Bar -->
        <div class="div-search">
          <input class="search-inpt" type="text" placeholder="Pesquisar..." />
          <button class="search-btn">Buscar</button>
        </div>
        <!-- Login Icon -->
        <div class="icon-login">
          <a href="./login.html">
            <ion-icon class="login" name="person-circle-outline"></ion-icon>
          </a>
        </div>
      </nav>
    </header>

    <!-- Main Section -->
    <main class="div-login">
      <section class="form-login">

        <div class="link-icon">
          <a class="lgn" href="./login.html">
            <ion-icon class="link-icon login" name="person-circle-outline"></ion-icon>
          </a>
        </div>

        <form action="login.html" class="form-login">

            <label class="title-login" for="email">E-mail:</label><br />
            <input
              class="input-login"
              type="email"
              name="email"
              id="email"
              placeholder="email@dominio.com.br"
              required
            />


            <label class="title-login" for="senha"><br>Senha:</label><br />
            <input
              class="input-login"
              type="password"
              name="senha"
              id="senha"
              placeholder="••••••••••••••"
              required
            />

          <div class="div-buy-btn">
            <input class="buy-btn" type="submit" value="Entrar" />
          </div>
      </section>

    </main>

    <!-- Footer Section -->
    <footer class="footer">
        <section class="container-footer">

          <div class="copyright">
            <p class="copyright-text">
              Todos os direitos reservados ©
            </p>
          </div>


        </section>
      </footer>
  
      <script
        type="module"
        src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
      ></script>

</body>
</html>
